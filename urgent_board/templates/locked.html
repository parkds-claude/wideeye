<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>긴급현황판 — 열쇠가 필요합니다</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/list.css">
</head>
<body>
<main>
  <h1>긴급현황판 <small>접속 열쇠가 필요합니다</small></h1>
  <p class="sum">이 화면은 메시지가 들어 있어 이 맥의 사용자만 열 수 있다.</p>
  <p class="hint">열쇠는 자료 폴더의 <code>auth/api-token</code> 에 있다. 터미널에서 <code>cat ~/Library/Application\ Support/UrgentBoard/auth/api-token</code> 으로 보고 아래에 넣는다. 한 번 열면 이 브라우저는 1년 동안 그대로 열린다.</p>
  <form method="get" action="/auth">
    <input type="password" name="t" autocomplete="off" placeholder="접속 열쇠" required>
    <input type="hidden" name="next" value="{{ next or '/' }}">
    <button type="submit">열기</button>
  </form>
</main>
</body>
</html>
