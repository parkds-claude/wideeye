# 판정 규칙의 기본값(제품판 2026-10-15). 사용자 것은 자료 폴더 settings.yaml 의 rules: 에 적은 칸만 이 위에 겹쳐 쓴다(깊은 병합 —
# junk.gmail_labels 는 적으면 통째로 바뀐다). 낱말 · 문턱값 · 조사 C §6·§7. 완성형 음절만 쓴다. 문턱의 시간 단위는 업무시간.
thresholds:
  # 읽고 답 안 한 질문 · 요청을 대기로 볼 때까지(업무시간 분). 2026-10-16 부터 분으로 적는다 — 사용자 "읽어도 10분 후에는 표시가 되게"
  # (이 맥은 설정에서 셋 다 10분). 예전처럼 unanswered_dm_hours · unanswered_group_hours 로 적은 덮어쓰기는 분으로 바꿔 쓴다(config.build_rules).
  unanswered_dm_minutes: 120     # 1:1(메일 · 카톡 · 텔레그램)
  unanswered_group_minutes: 240  # 단톡(나를 부른 글)
  unanswered_sms_minutes: 20     # 1:1 문자(사용자 2026-10-15 "읽은 문자 요청은 20분으로")
  deadline_within_hours: 8
  waiting_deadline_days: 3
  nudge_count: 2          # 처음 메시지 + 재촉 1번 = 2
  resolved_max_chars: 12  # 이 글자 수(공백·문장부호 제외) 이하의 '해결됐습니다/감사합니다' 류만 해결로 본다 — 긴 후속의 끝인사는 해결이 아니다
  nudge_gap_min: 10       # 이 분 안에 이어 보낸 메시지는 재촉으로 세지 않는다(나눠 쓴 메시지)
  group_other_reply_min: 5
  after_my_message_min: 10
# 긴급에서 빼는 것(스팸·광고·자동 발송). 사용자 정의(2026-10-13): "긴급은 내가 확인하지 않은 메일, 메세지. 스팸, 광고성은 제외"
junk:
  # Gmail 이 붙인 분류 → 빼는 까닭. 줄을 지우면 그 분류는 빼지 않는다(예: 자동 알림도 긴급으로 보려면 CATEGORY_UPDATES 줄 삭제).
  # 사용자 결정(2026-10-13 16:0x): 자동 알림(은행·홈택스·주문)은 "지금은 빼자" — CATEGORY_UPDATES 줄을 그대로 둔다.
  # 내가 메일을 보낸 적 있는 상대의 notice·bulk 는 빼지 않는다(Gmail 이 거래처 메일을 '업데이트'로 잘못 분류하는 경우).
  gmail_labels:
    CATEGORY_PROMOTIONS: ad
    CATEGORY_SOCIAL: ad
    SPAM: ad
    CATEGORY_FORUMS: bulk
    CATEGORY_UPDATES: notice
  # 협회·단체가 돌리는 행사 공지도 광고·홍보다(사용자 2026-10-14 "협회 토론회 안내 --> 광고,홍보성으로 보임") —
  # "회원사 여러분" · "많은 관심과 참여/신청". 9/1 이후 저장된 2,119건에서 협회 공지 5건만 걸렸다. 지켜보는 방(watch_rooms)에는 쓰지 않는다.
  ad_text_re: "\\(광고\\)|\\[광고\\]|무료\\s*(?:수신)?\\s*거부|수신\\s*거부|회원사\\s*여러분|많은\\s*관심과\\s*(?:참여|신청)"
  auto_text_re: "\\[Web발신\\]|\\[국제발신\\]|\\[국외발신\\]"
  # 확실히 알림 · 홍보용인 하위 주소에서 온 메일은 자동 발송(사용자 2026-10-17 "둘 다 오케" — 알리바바 홍보 메일이 Gmail '개인' 분류에 수신 거부
  # 머리글도 없이 들어와 읽은 뒤에도 탭5 알림에 남았다). mail. · info. · e. · em. 은 넣지 않는다 — 회사 직원 주소(mail.회사.co.kr)에도 쓰인다(독립 검토).
  # 저장된 6주치(9/2~10/17)에서 걸린 것은 모두 회사의 자동 메일(애플 · 메타 · ChatGPT · 알리바바 · Railway 등)이고 사람이 보낸 것은 0.
  # 공공 · 학교 주소(.ac.kr · .go.kr · .or.kr · .re.kr)는 걸지 않고, 내가 메일을 보낸 적 있는 주소(저장된 최근 7일 안)도 빼지 않는다(preprocess.is_auto).
  # 메일 주소의 @ 뒤(도메인)에 대소문자 없이 견준다
  auto_domain_re: "^(?:notice|notices|news|newsletter|mailer|email|mkt|marketing|promo|noti|alert|alerts|campaign|edm)\\.(?!.*\\.(?:ac|go|or|re|mil)\\.kr$)[^.]+\\."
  # 문자: 한국 번호 가운데 휴대폰(010 · 011 · 016~019) · 인터넷 전화(070)가 아닌 것(대표번호 · 유선 — 카드 승인 등)이고 맥 연락처에도 없고
  # 내가 그 번호에 문자를 보낸 적도 없으면(저장된 최근 7일 안) 자동 발송(같은 날 결정). 해외 번호(+82 가 아닌 +…)는 걸지 않는다 — 해외의 사람 ·
  # 거래처(독립 검토). 앞부분이 숫자뿐인 주소(15880000@… — 기업 메시지)도 자동 발송, 사람의 이메일 주소(Apple ID)는 걸지 않는다(preprocess.sms_auto).
  # 보낸 사람 번호의 숫자에 견준다
  sms_person_re: "^(?:82|0)(?:1[016789]|70)"
client_titles: ["주무관", "사무관", "과장님", "국장님", "담당관", "발주처", "팀장님"]
# 긴급 낱말은 '서두르라'는 명시적 표현만 둔다. 계약·입금·결제·발주·취소·사고·마감·기한·승인 요청 같은 주제어는 뺐다 —
# 사용자 판단(2026-10-13): 그런 낱말이 들었다고 급한 것이 아니다. 기한은 날짜 + '까지' 로 따로 잡는다.
urgent_words_ko: "(긴급|급(?:히|하게|합니다|해요|함|한\\s*건)|시급|최대한\\s*빨리|지금\\s*(?:바로|당장)|당장|즉시|조속(?:히|한)|서둘러|빠른\\s*(?:회신|답변|확인|처리|연락)|오늘\\s*(?:중|안|내|까지)|금일\\s*(?:중|내|까지)|퇴근\\s*전|점심\\s*전|오전\\s*중|한\\s*시간\\s*(?:내|안)|늦어도|미회신|답(?:이|변이)?\\s*없|연락\\s*(?:안|없)|재차|다시\\s*한\\s*번\\s*(?:요청|부탁)|전화\\s*(?:주세요|부탁|바랍|드렸)|통화\\s*가능|문제\\s*(?:생겼|발생))"
urgent_words_en: "\\b(urgent(?:ly)?|asap|immediately|right away|critical|emergency|time[- ]sensitive|deadline|due (?:today|tomorrow|by)|by (?:eod|cob|eow|noon|end of (?:day|business|week))|overdue|blocked|action required|response required|please respond|final (?:notice|reminder)|last call)\\b|!{2,}"
# 날짜·시각 표현 바로 뒤에 이 꼬리말이 있어야 기한으로 본다("내일 회의"는 기한이 아니다). 표현 자체가 '중/내'로 끝나도 기한("금주 중").
deadline_suffix_ko: "^\\s*(?:전\\s*)?(?:까지|내로|내에|이내|안으로|안에|중으로|중에|으로\\s*(?:회신|답변|제출|확정|부탁))"
deadline_inner_ko: "(?:중|내)$"
soft_words_ko: "(내일\\s*(?:오전|아침|까지|중)|모레까지|이번\\s*주\\s*(?:내|중|까지)|주내|금주\\s*(?:내|중)|가능하면\\s*빨리|신속)"
question_ends_ko: "(?:까요|나요|가요|니까|지요|는지|신지|은지|죠|은가|는가|나용|까용)\\s*[?？]*\\s*$"
question_ends_short_ko: "(?:나|니|냐|까|지)\\s*[?？]\\s*$"
# 물음표 없는 간접 질문(사용자 2026-10-15 — "…언제까지 받으실껀지 궁금합니다!!" 가 대기로 안 떴다). '궁금증이 풀렸다' · '궁금했는데' 는 걸리지 않게 어미까지 적는다
question_indirect_ko: "궁금(?:합니다|해요|하네요|합니당|해서)|여쭙(?:니다|습니다|고자|어요|겠습니다)|여쭤\\s*(?:봅니다|보려|볼게요|봐요|보고)|문의\\s*드(?:립니다|려요)"
question_wh_ko: "(?<![가-힣])(언제|어디|어떻게|어떤|무엇|뭐|몇|얼마|누구|왜|어느)"
request_ko: "(부탁(?:드립니다|드려요|합니다|해요)|바랍니다|바래요|주세요|주시(?:면|기|겠|길)|요망|요청(?:드립니다|합니다)|(?:회신|답변|답장)\\s*(?:을|를|은|이|도|좀)?\\s*(?:기다리|가능|주십시오|해\\s*주)|알려\\s*주|보내\\s*주|공유\\s*(?:부탁|해\\s*주)|가능(?:할까요|한지|하신지|여부|할지)|검토\\s*(?:부탁|요망|바랍)|승인\\s*(?:부탁|요망|바랍)|의견\\s*(?:부탁|주)|확정\\s*(?:부탁|요망|필요|바랍)|확인\\s*(?:바랍|부탁|요망|해\\s*주))"
question_en: "\\?\\s*$|\\b(what|when|where|who|why|how|which)\\b.*\\?|\\b(could|can|would|will|do|does|did|is|are|should|may)\\s+(you|we|i|it)\\b"
request_en: "\\b(please|kindly|pls)\\b|\\b(let me know|let us know|lmk|please confirm|kindly confirm|confirm (?:receipt|if|whether)|could you|can you|would you|would you mind|get back to (?:me|us)|your (?:thoughts|input|feedback|approval|confirmation)|advise|rsvp)\\b"
# 한국어 · 영어 규칙이 읽지 못하는 말(러시아어 · 중국어 · 페르시아어 · 프랑스어 · 일본어 …)로 쓴 글 — 질문 · 요청일 수 있는 것(foreign)으로 보고
# 한국어 요청과 같은 길로 보낸다(읽어도 문턱이 지나면 대기 · 답할 때까지 할 일). 할 일인지는 요약과 같은 Claude 호출이 가린다(할 일: 예|아니오).
# 사용자 2026-10-17 "외국어 문의도 일반 메일과 동일하게 분석 · 반영할 것" — 그전에는 읽는 순간 '할 일 아님'으로 닫혔다.
foreign:
  min_letters: 8              # 글자가 이보다 적으면 따지지 않는다(한마디 인사)
  hangul_share: 0.3           # 한글이 글자의 이만큼이면 한국어 글(외국어 회신 끝의 한국어 서명 · 인용은 이보다 적다)
  other_script_share: 0.3     # 라틴 · 한글이 아닌 글자(키릴 · 아랍 · 한자 · 가나 · 타이 …)가 글자의 이만큼이면 외국어
  min_words: 4                # 라틴 글자 글은 낱말이 이만큼 있어야 영어인지 따진다
  english_share_min: 0.12     # 라틴 글자 글에서 아래 영어 낱말이 낱말의 이만큼 안 되면 영어가 아니다(프랑스어 · 스페인어 · 독일어 …)
  english_words: "the|and|to|of|a|an|you|your|is|are|was|for|we|our|us|i|it|this|that|in|on|with|be|have|has|will|can|would|could|please|thank|thanks|regards|dear|hello|hi|me|my|not|do|at|as|if|received|noted|ok|yes|no|lot|very|much"
# 판정 전에 지우는 인사말 — "잘 부탁드립니다"의 '부탁'은 요청이 아니다
courtesy_ko: "잘\\s*부탁\\s*(?:드립니다|드려요|드리겠습니다|합니다|해요)|수고\\s*(?:하세요|하십시오|많으십니다)"
resolved_ko: "(해결(?:됐|되었|했)|됐습니다|처리(?:됐|되었|완료)|확인했습니다|취소합니다|신경\\s*(?:안|쓰지)|괜찮습니다|감사합니다\\s*$|^넵$|네\\s*알겠습니다)"
# 추임새·인사만 있는 메시지(낱말 단위로 적는다 — 글자 모음으로 적으면 '사고' 같은 말이 잡음이 된다). 물음표 하나는 재촉이라 넣지 않는다.
noise_only: "^(?:[\\s!.~^;,]|[\\U0001F300-\\U0001FAFF\\u2600-\\u27BF\\uFE0F\\u200D]|ㅋ+|ㅎ+|ㅠ+|ㅜ+|ㅇㅋ|ㅇㅇ|넵|넹|네|예|옙|옛|넴|오키|ok|OK|굿|굳|감사합니다|감사해요|고맙습니다|수고하셨습니다|고생하셨습니다|알겠습니다)*$"
auto_sender_re: "^(noreply|no-reply|do-?not-?reply|donotreply|notifications?|notif|alerts?|mailer-daemon|postmaster|bounces?|newsletter|news|updates?|account|system|marketing|promo|app|security|verify|verification|auth)@"
auto_subject_re: "^(auto(?:matic)? ?reply|out of office|자동\\s*회신|부재중|부재\\s*알림|\\[광고\\]|\\(광고\\)|\\[AD\\]|수신확인|읽음\\s*확인)|\\bis out of the office\\b|verification code|confirm your (?:email|account)|password reset|security alert|인증\\s*(?:번호|코드)|보안\\s*(?:알림|경고)|비밀번호\\s*(?:재설정|변경)"
quote_cut_re: "(?m)^(>|-----Original Message-----|On .* wrote:|보낸 사람:|From: )"
