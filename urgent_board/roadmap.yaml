# WideEye 설정 길 — 단계 정의(골격). 설계 docs/exec-plans/2026-10-18-open-source-guided-setup-design.md 의 G4 · G6 · G7 · G8 · G12 · G16.
# 읽는 코드: urgent_board/guide.py(load 가 꼴을 검사한다 — 틀리면 시작하지 않는다). 시험: tests/test_guide.py.
#
# 단계의 칸
#   id        소문자 · 숫자 · '-'
#   title     제목 · why 한 줄 · tell 먼저 알릴 것(AI 가 그대로 전한다) · do 사람이 할 일(한 줄에 한 동작) · confirm 사람에게 물을 한 문장
#             — 사람 말: 쉬운 말 먼저, 화면의 실제 이름은 괄호로. 두루 쓰는 단계에서는 메신저 상표를 내세우지 않는다.
#             do · tell 의 한 줄은 글 또는 {if: 조건, say: 글}(그 사람에게 맞을 때만 보인다). {marker} 는 시험 낱말로 채워진다.
#   who       ai | person | both
#   run       AI 가 부를 명령(wideeye … 만, 설치 뒤에 있는 것만) · after: 사람이 '했어요' 한 뒤 확인하기 전에 부를 명령
#   check     확인기 이름(guide.KNOWN_CHECKS) · params: 확인기에 넘길 값
#   needs     앞선 단계(모두 됨 · 건너뜀이어야) · needs_any: 그 가운데 하나라도 '됨'이어야
#   skip_if   조건 목록(하나라도 맞으면 건너뜀, say 는 건너뛰는 까닭) — 키는 프로필(messengers · iphone · tab5 · ai · admin)과
#             사실(firmware_public)만. yes · no 는 따옴표로(따옴표가 없으면 YAML 이 참 · 거짓으로 읽는다).
#   stuck     막혔을 때 갈림길: when(확인기가 붙인 말 또는 ok · fail · unknown · human) · say · then(단계 id 또는 wideeye 명령) · if(조건)
#
# 차례: 설계 표 그대로이되, 메신저 잇기는 메신저마다 한 단계(결정 R5) — 쉬운 셋(문자 · 부재중 전화 · 팀즈)은 첫 알림 시험 앞,
# 어려운 둘(Gmail · 텔레그램)은 탭5 뒤. 첫 알림 시험(try)은 글을 싣는 잇기 가운데 하나라도 되면 열린다(부재중 전화는 글이 없다).
version: 1
steps:
  - id: hello
    title: "시작 — 무엇이 AI 에게 가는지 알고, 몇 가지 답하기"
    why: "당신에게 맞는 길만 고르려고, 그리고 무엇이 AI 에게 가는지 먼저 알려 드리려고 해요."
    who: both
    tell:
      - "설정하는 동안 AI 에게 가는 것: 당신의 이름 · 메일 주소 · 상자 이름 · 당신에게 연락한 사람과 방의 이름이에요."
      - "메시지 본문은 기본으로 가지 않아요. 제목이나 앞부분을 보여야 할 때는 그때마다 먼저 물어요."
      - "비밀번호와 로그인 코드는 AI 에게 말하지 마세요. 그런 것은 AI 가 이 맥에 열어 주는 입력 화면에 직접 넣어요."
      - "남는 위험: 이 맥에서 명령을 실행할 수 있는 AI 는 마음만 먹으면 이 맥의 다른 파일도 읽을 수 있어요. 믿을 수 있는 AI 만 쓰세요."
      - "중간에 그만둬도 괜찮아요. 다음에 '이어서'라고 하면 그 자리부터 해요."
      - "어떤 AI 인지(맥에서 직접 일하는 AI 인지, 대화만 하는 AI 인지)는 AI 가 스스로 알아서 적어요. AI 가 잘 모를 때만 여쭤볼게요."
    confirm: "이것을 알고 시작할까요?"
    do:
      - "위 글을 읽어요."
      - "시작해도 되면 '예', 아니면 '아니요'라고 답해요."
      - "쓰는 것을 모두 골라요: 문자 · 부재중 전화(아이폰이 있어야 해요) · Microsoft Teams 알림 · Gmail(어려운 길) · 텔레그램(어려운 길) · 그 밖의 메신저(이름도 알려 주세요 — 이번 판에서는 아직 읽지 못해요)."
      - "아이폰을 쓰는지 답해요."
      - "탭5 가 지금 이 맥에 꽂혀 있는지, 없는지, 나중에 할지 답해요."
      - "이 맥에 프로그램을 깔 때 넣는 암호(관리자 암호)를 아는지 답해요."
    run:
      - "wideeye guide profile messengers=<고른것_쉼표로> iphone=<yes|no> tab5=<plugged|none|later> ai=<a|b|c> admin=<yes|no>"
    check: hello
    stuck:
      - when: no_consent
        say: "시작하기 전에 위 글에 '예' 또는 '아니요'로 답해 주세요."
        then: hello
      - when: said_no
        say: "괜찮아요. AI 없이 이 맥의 설정 화면에서 직접 할 수도 있어요."
        then: "wideeye open settings"
      - when: no_profile
        say: "아직 답하지 않은 것이 있어요. 하나씩 다시 물어볼게요."
        then: hello
      - when: engine_down
        say: "WideEye 가 아직 답하지 않아요. 그것부터 볼게요."
        then: install

  - id: install
    title: "WideEye 가 이 맥에서 돌고 있는지 보기"
    why: "다음 단계들은 WideEye 가 이 맥에서 돌고 있어야 할 수 있어요."
    who: ai
    needs: [hello]
    do:
      - "AI 가 살펴보는 동안 기다려요."
      - "맥 화면 오른쪽 위에 '백그라운드에서 실행될 수 있습니다' 알림이 뜨면 닫아도 돼요."
    check: install
    stuck:
      - when: not_running
        if: {ai: [a, b]}
        say: "AI 가 이 맥 안의 WideEye 에 닿지 못하게 막혀 있을 수 있어요. AI 가 실행해도 되는지 물으면 화면의 허락 단추(예: Yes · Allow)를 골라 주세요."
      - when: not_running
        say: "WideEye 가 아직 돌지 않아요. AI 가 켜 볼게요."
        then: "wideeye start"
      - when: fail
        say: "그래도 안 되면 AI 가 무엇이 막혔는지 살펴볼게요."
        then: "wideeye doctor"

  - id: permit-messages
    title: "맥이 문자를 읽게 허락하기"
    why: "WideEye 가 이 맥의 메시지 앱에 온 문자를 읽으려면 맥의 허락이 한 번 필요해요."
    who: person
    needs: [install]
    skip_if:
      - {messengers: {lacks: sms}}
    do: &allow
      - {if: {admin: "no"}, say: "이 단계에는 이 맥의 관리자 암호가 필요해요. 관리자에게 잠깐 옆에 와 달라고 부탁하세요."}
      - "AI 가 연 허락 화면을 봐요(시스템 설정 › 개인정보 보호 및 보안 › 전체 디스크 접근 권한)."
      - "목록 바로 아래 왼쪽의 + 단추를 눌러요."
      - "맥 암호를 넣거나 지문을 대요."
      - "파일 고르는 창이 뜨면 ⌘(커맨드) ⇧(시프트) G 세 글쇠를 함께 눌러요."
      - "AI 가 알려 주는 위치 한 줄을 복사해요(⌘ C)."
      - "새로 뜬 작은 입력 칸에 붙여 넣어요(⌘ V)."
      - "Return 을 눌러요."
      - "오른쪽 아래의 '열기' 단추를 눌러요."
      - "목록에 새로 생긴 줄 오른쪽의 스위치를 켜요(파랗게 바뀌어요)."
      - "'종료 후 다시 열기'를 묻는 창이 뜨면 '나중에'를 눌러요. AI 가 WideEye 만 다시 켜요."
      - "다 했으면 AI 에게 '했어요'라고 말해요."
    run: ["wideeye setup permissions"]
    after: ["wideeye restart engine"]
    check: permit_messages
    stuck:
      - &no_access
        when: no_access
        say: "아직 허락이 안 됐어요. 목록에 새 줄이 있고 그 스위치가 켜져 있는지 봐 주세요."
      - &no_access_admin
        when: no_access
        if: {admin: "no"}
        say: "관리자 암호가 필요해요. 이 맥의 관리자에게 이 한 가지만 부탁하세요: 전체 디스크 접근 권한 목록에 WideEye 파일 하나를 더하고 켜 달라고요."
      - when: no_data
        say: "이 맥의 메시지 앱에 아직 아무것도 없어요. 메시지 앱을 한 번 열어 로그인돼 있는지 봐 주세요."
      - when: no_data
        if: {iphone: "yes"}
        say: "아이폰 문자를 맥에서도 받으려면 아이폰에서 문자 전달을 켜요(아이폰 설정 › 앱 › 메시지 › 문자 메시지 전달 › 이 맥)."

  - id: permit-calls
    title: "맥이 부재중 전화를 읽게 허락하기"
    why: "받지 못한 전화를 띄우려면 맥의 허락이 한 번 필요해요."
    who: person
    needs: [install]
    skip_if:
      - {messengers: {lacks: calls}}
    tell:
      - {if: {messengers: {has: sms}}, say: "문자에서 한 허락과 같은 허락이에요. 이미 했다면 AI 가 확인만 해요."}
    do: *allow
    run: ["wideeye setup permissions"]
    after: ["wideeye restart engine"]
    check: permit_calls
    stuck:
      - *no_access
      - *no_access_admin
      - when: no_data
        say: "이 맥에 아직 통화 기록이 없어요. 부재중 전화는 아이폰으로 온 전화가 이 맥에서도 울려야 보여요."
      - when: no_data
        if: {iphone: "yes"}
        say: "아이폰에서 다른 기기 통화를 켜요(아이폰 설정 › 앱 › 전화 › 다른 기기에서 통화 › 이 맥). 맥에서는 FaceTime 앱의 설정에서 'iPhone에서 통화'를 켜요."
      - when: no_data
        if: {iphone: "no"}
        say: "부재중 전화는 아이폰이 있어야 이 맥에 와요. 이 단계는 빼도 돼요."
        then: "wideeye guide profile"

  - id: permit-teams
    title: "맥이 팀즈 알림을 읽게 허락하기"
    why: "맥 알림 센터에 뜬 팀즈 알림을 띄우려면 맥의 허락이 한 번 필요해요."
    who: person
    needs: [install]
    skip_if:
      - {messengers: {lacks: teams}}
    tell:
      - {if: {messengers: {has: [sms, calls]}}, say: "앞에서 한 허락과 같은 허락이에요. 이미 했다면 AI 가 확인만 해요."}
    do: *allow
    run: ["wideeye setup permissions"]
    after: ["wideeye restart engine"]
    check: permit_teams
    stuck:
      - *no_access
      - *no_access_admin
      - when: no_data
        say: "이 맥에 아직 알림 기록이 없어요. 팀즈 앱을 이 맥에서 켜 두고, 알림이 한 번 뜬 뒤에 다시 볼게요."

  - id: link-sms
    title: "문자 잇기"
    why: "이 맥의 메시지 앱에 온 문자를 WideEye 가 읽기 시작해요."
    who: both
    needs: [permit-messages]
    skip_if:
      - {messengers: {lacks: sms}}
    do:
      - {if: {iphone: "yes"}, say: "아이폰에서 이 맥으로 문자 전달을 켜요(아이폰 설정 › 앱 › 메시지 › 문자 메시지 전달 › 이 맥 — 예전 아이폰은 설정 › 메시지)."}
      - "맥의 메시지 앱을 열어요."
      - "로그인돼 있는지 봐요(메시지 › 설정 › iMessage)."
      - "AI 가 문자 읽기를 켜는 동안 기다려요."
    run: ["wideeye setup source imessage on"]
    check: link
    params: {source: imessage}
    stuck:
      - when: waiting
        say: "첫 문자를 읽는 중이에요. 10초쯤 뒤에 다시 볼게요."
        then: link-sms
      - when: not_linked
        say: "문자 읽기가 아직 꺼져 있어요. AI 가 다시 켤게요."
        then: "wideeye setup source imessage on"
      - when: stopped
        say: "문자를 읽다가 멈췄어요. 대개 맥의 허락이 풀린 거예요."
        then: permit-messages

  - id: link-calls
    title: "부재중 전화 잇기"
    why: "아이폰으로 온 전화 가운데 받지 못한 것을 WideEye 알림에 띄워요."
    who: both
    needs: [permit-calls]
    skip_if:
      - {messengers: {lacks: calls}}
    do:
      - {if: {iphone: "yes"}, say: "아이폰에서 다른 기기 통화를 켜요(아이폰 설정 › 앱 › 전화 › 다른 기기에서 통화 › 이 맥)."}
      - "맥의 FaceTime 앱을 열어요."
      - "'iPhone에서 통화'를 켜요(FaceTime › 설정 › 일반)."
      - "AI 가 부재중 전화 읽기를 켜는 동안 기다려요."
    run: ["wideeye setup source calls on"]
    check: link
    params: {source: calls}
    stuck:
      - when: waiting
        say: "처음 읽는 중이에요. 10초쯤 뒤에 다시 볼게요."
        then: link-calls
      - when: not_linked
        say: "부재중 전화 읽기가 꺼져 있어요. AI 가 다시 켤게요."
        then: "wideeye setup source calls on"
      - when: stopped
        say: "읽다가 멈췄어요. 대개 맥의 허락이 풀린 거예요."
        then: permit-calls

  - id: link-teams
    title: "팀즈 알림 잇기"
    why: "맥 알림 센터에 뜬 팀즈 알림을 WideEye 알림에 띄워요."
    who: both
    needs: [permit-teams]
    skip_if:
      - {messengers: {lacks: teams}}
    do:
      - "맥에서 팀즈 알림이 뜨게 켜요(시스템 설정 › 알림 › Microsoft Teams › 알림 허용)."
      - "같은 화면에서 알림에 글 앞부분이 보이게 해요(미리보기 보기 › 항상)."
      - "팀즈 앱을 이 맥에서 켜 두어요."
      - "AI 가 팀즈 알림 읽기를 켜는 동안 기다려요."
    run: ["wideeye setup source teams on"]
    check: link
    params: {source: teams}
    stuck:
      - when: waiting
        say: "처음 읽는 중이에요. 10초쯤 뒤에 다시 볼게요."
        then: link-teams
      - when: not_linked
        say: "팀즈 알림 읽기가 꺼져 있어요. AI 가 다시 켤게요."
        then: "wideeye setup source teams on"
      - when: stopped
        say: "읽다가 멈췄어요. 대개 맥의 허락이 풀린 거예요."
        then: permit-teams

  - id: try
    title: "첫 알림 시험"
    why: "글 하나가 WideEye 에 뜨는 것을 지금 확인해요. 상자와 기준은 그다음에 다듬어요."
    who: both
    needs: [install]
    needs_any: [link-sms, link-teams, link-gmail, link-telegram]
    do:
      - "AI 가 알려 주는 시험 낱말(예: 해바라기 27)을 기억해요."
      - "가족이나 친구에게, 그 낱말로 시작하는 글을 나에게 보내 달라고 부탁해요. 낱말은 글의 맨 앞에 와야 해요. 앞에서 이은 것 가운데 하나로요(문자 · 메일 · 메신저)."
      - "부탁할 사람이 없으면 내 다른 번호나 다른 메일 주소에서 나에게 보내요."
      - "보냈으면 1분쯤 기다려요."
      - "AI 에게 '보냈어요'라고 말해요."
    run: ["wideeye guide marker"]
    check: try_marker
    stuck:
      - when: no_marker
        say: "시험 낱말을 아직 만들지 않았어요. AI 가 만들게요."
        then: "wideeye guide marker"
      - when: not_yet
        say: "아직 안 왔어요. 보낸 뒤 1분쯤 걸려요. 조금 뒤에 다시 볼게요."
        then: try
      - when: not_yet
        say: "내가 나에게 보낸 글은 '내가 쓴 글'로 보여 뜨지 않을 수 있어요. 다른 사람이나 내 다른 번호 · 주소에서 보내 주세요."
      - when: unreachable
        say: "지금 고른 것으로는 시험 글을 띄울 수 없어요. 부재중 전화에는 글이 없고, 목록에 없는 메신저는 아직 읽지 못해요. 문자나 메일을 쓴다면 하나 더 골라 주세요."
        then: "wideeye guide profile"

  - id: tab5-flash
    title: "탭5 에 WideEye 프로그램 넣기"
    why: "탭5 가 WideEye 화면을 받으려면 탭5 안에 전용 프로그램이 있어야 해요."
    who: ai
    needs: [try]
    skip_if:
      - {tab5: [none, later]}
      - {firmware_public: false, say: "탭5 에 넣을 프로그램은 아직 준비 중이에요. 이 단계는 건너뛰어요."}
    do:
      - "탭5 를 USB-C 선으로 이 맥에 꽂아 두어요."
      - "AI 가 프로그램을 넣는 동안 선을 뽑지 말아요."
      - "탭5 가 다시 켜지면 AI 에게 알려 줘요."
    check: tab5_flash
    stuck:
      - when: no_tab5
        say: "맥이 탭5 를 찾지 못했어요. 선을 뽑았다가 다시 꽂아 주세요. 충전만 되는 선이면 다른 선으로 바꿔 주세요."
        then: tab5-flash
      - when: not_flashed
        say: "탭5 에 아직 WideEye 프로그램이 없어요. AI 가 다시 넣어 볼게요."
        then: tab5-flash

  - id: tab5-show
    title: "탭5 를 WideEye 화면으로 잇기"
    why: "맥이 탭5 로 알림 그림을 보내기 시작해요."
    who: both
    needs: [try, tab5-flash]
    skip_if:
      - {tab5: [none, later]}
      - {firmware_public: false, say: "탭5 에 넣을 WideEye 프로그램은 아직 준비 중이에요. 지금은 맥 화면으로 보고, 탭5 는 프로그램이 나오면 이어요."}
    do:
      - "탭5 를 USB-C 선으로 이 맥에 꽂아 두어요."
      - "탭5 가 켜져 있는지 봐요(화면이 밝아요)."
      - "30초쯤 뒤에 탭5 화면에 WideEye 그림이 뜨는지 봐요."
    run: ["wideeye setup tab5", "wideeye setup tab5 <찾은탭5번호>", "wideeye start display"]
    check: tab5_show
    stuck:
      - when: no_tab5
        say: "맥이 탭5 를 찾지 못했어요. 선을 뽑았다가 다시 꽂아 주세요."
        then: tab5-show
      - when: not_live
        say: "탭5 가 아직 그림을 받지 않아요. 1분쯤 뒤에 다시 볼게요."
        then: tab5-show

  - id: try-tab5
    title: "탭5 에서 첫 알림 보기"
    why: "맥에 뜬 시험 글이 탭5 화면에도 보이는지 눈으로 확인해요."
    who: both
    needs: [try, tab5-show]
    skip_if:
      - {tab5: [none, later]}
      - {firmware_public: false, say: "탭5 에 넣을 WideEye 프로그램은 아직 준비 중이라 탭5 에서 보는 시험도 건너뛰어요. 맥 화면으로 본 첫 알림이면 돼요."}
    do:
      - "탭5 화면을 봐요."
      - "시험 낱말 '{marker}' 가 화면에 있는지 찾아요."
      - "보이면 '예', 안 보이면 '아니요'라고 답해요."
    confirm: "탭5 화면에 '{marker}' 가 보이나요?"
    check: try_tab5
    stuck:
      - when: not_drawn
        say: "탭5 가 아직 새 그림을 받지 않았어요. 30초쯤 뒤에 다시 볼게요."
        then: try-tab5
      - when: said_no
        say: "맥에는 떴는데 탭5 에는 안 보여요. AI 가 탭5 잇기를 다시 볼게요."
        then: tab5-show
      - when: no_tab5
        say: "맥이 탭5 를 찾지 못했어요. 선을 다시 꽂아 주세요."
        then: tab5-show

  - id: link-gmail
    title: "Gmail 잇기(어려운 길)"
    why: "Gmail 로 온 메일을 WideEye 가 읽게 해요."
    who: both
    needs: [install]
    skip_if:
      - {messengers: {lacks: gmail}}
    tell:
      - "지금 판의 Gmail 잇기는 어려운 길이에요. 구글 개발자 화면에서 열쇠 파일을 한 번 만들어야 하고, 처음이면 30분쯤 걸려요."
      - "더 쉬운 길은 다음 판에 나와요. 지금 하지 않고 나중에 해도 돼요."
      - "구글 화면에는 개발자용 이름(영어가 섞인 말)이 많이 나와요. 뜻은 몰라도 돼요. 따옴표 안의 말을 화면에서 찾아 누르기만 하면 돼요."
      - "구글 비밀번호는 AI 에게 말하지 말고, 구글 로그인 화면에만 넣어요."
    do:
      - "브라우저에서 구글 클라우드 화면(console.cloud.google.com)을 열어요."
      - "메일을 받는 그 Gmail 계정으로 로그인해요."
      - "화면 위쪽의 프로젝트 고르는 칸을 눌러요."
      - "'새 프로젝트'를 눌러요."
      - "이름은 그대로 두고 '만들기'를 눌러요."
      - "왼쪽 차림표에서 'API 및 서비스'를 눌러요."
      - "'라이브러리'를 눌러요."
      - "'Gmail API'를 찾아 눌러요."
      - "'사용'을 눌러요. 메일 읽기 기능이 켜져요."
      - "왼쪽 차림표에서 'OAuth 동의 화면'을 눌러요."
      - "사용자 유형에서 '외부'를 골라요."
      - "앱 이름 칸에 아무 이름이나 적어요(예: WideEye)."
      - "메일 주소를 적으라는 칸이 있으면 내 Gmail 주소를 골라요."
      - "'범위'에서 'gmail.readonly'를 더해요. 메일을 읽기만 하는 권한이에요."
      - "'프로덕션으로 게시'를 눌러요. '테스트'로 두면 7일마다 다시 이어야 해요."
      - "왼쪽 차림표에서 '사용자 인증 정보'를 눌러요."
      - "'OAuth 클라이언트 ID 만들기'를 눌러요."
      - "애플리케이션 유형에서 '데스크톱 앱'을 골라요."
      - "'만들기'를 눌러요."
      - "'JSON 다운로드'를 눌러 열쇠 파일을 내려받아요."
      - "AI 가 이 맥에 연 WideEye 화면의 메일 칸에서 [클라이언트 파일 넣기]를 눌러요."
      - "방금 내려받은 파일을 골라요."
      - "[메일 계정 더하기]를 눌러요."
      - "구글 로그인 창에서 그 Gmail 계정을 골라요."
      - "'확인되지 않은 앱' 경고가 나오면 '고급'을 눌러요. 내가 만든 앱이라 괜찮아요."
      - "그 아래에 나온 '…(으)로 이동'을 눌러요."
      - "'계속' 또는 '허용'을 눌러요."
      - "다 됐으면 AI 에게 '다 됐어요'라고 말해요."
    run: ["wideeye setup connect gmail"]
    check: link
    params: {source: gmail}
    stuck:
      - when: waiting
        say: "첫 메일을 읽는 데 5분쯤 걸려요. 조금 뒤에 다시 볼게요."
        then: link-gmail
      - when: not_linked
        say: "아직 이은 Gmail 계정이 없어요. 메일 칸의 [메일 계정 더하기]부터 해 주세요."
        then: "wideeye setup connect gmail"
      - when: reconnect
        say: "메일 연결이 풀렸어요. [메일 계정 더하기]로 그 계정에 다시 로그인해 주세요. 7일마다 되풀이되면 앱 게시(프로덕션으로 게시)를 다시 봐 주세요."
        then: "wideeye setup connect gmail"
      - when: stopped
        say: "메일을 읽다가 멈췄어요. 메일 칸에서 그 계정으로 다시 로그인해 주세요."
        then: "wideeye setup connect gmail"
      - when: fail
        say: "지금 하기 어렵다면 Gmail 은 빼고 나중에 해도 돼요."
        then: "wideeye guide profile"

  - id: link-telegram
    title: "텔레그램 잇기(어려운 길)"
    why: "텔레그램으로 온 글을 WideEye 가 읽게 해요."
    who: both
    needs: [install]
    skip_if:
      - {messengers: {lacks: telegram}}
    tell:
      - "텔레그램 잇기는 어려운 길이에요. 텔레그램 개발자 화면에서 앱을 하나 만들어야 하고, 처음이면 20분쯤 걸려요."
      - "그 화면에서 받은 값과 로그인 코드는 AI 에게 알려 주지 말고, AI 가 이 맥에 연 WideEye 화면에만 넣어요."
    do:
      - "브라우저에서 텔레그램 개발자 화면(my.telegram.org)을 열어요."
      - "내 전화번호를 나라 번호와 함께 넣어요(예: +82 10 …)."
      - "'Next'를 눌러요."
      - "텔레그램 앱으로 온 확인 코드를 넣어요."
      - "'Sign In'을 눌러요."
      - "'API development tools'를 눌러요."
      - "'App title' 칸과 'Short name' 칸에 아무 이름이나 적어요(예: WideEye)."
      - "'Create application'을 눌러요."
      - "화면에 보이는 앱 번호(숫자)를 복사해 WideEye 화면 텔레그램 칸의 첫째 칸에 넣어요."
      - "그 아래의 긴 값을 복사해 둘째 칸에 넣어요. 이 값은 AI 에게 보이지 마세요."
      - "셋째 칸에 내 전화번호를 넣어요."
      - "[코드 받기]를 눌러요."
      - "텔레그램 앱으로 온 코드를 넣어요."
      - "[로그인]을 눌러요."
      - "2단계 비밀번호를 쓰고 있으면, 새로 나타난 칸에 그 비밀번호를 넣어요."
      - "그다음 [로그인]을 다시 눌러요."
      - "다 됐으면 AI 에게 '다 됐어요'라고 말해요."
    run: ["wideeye setup connect telegram"]
    check: link
    params: {source: telegram}
    stuck:
      - when: waiting
        say: "첫 글을 읽는 데 2분쯤 걸려요. 조금 뒤에 다시 볼게요."
        then: link-telegram
      - when: not_linked
        say: "아직 로그인하지 않았어요. 텔레그램 칸에서 로그인부터 해 주세요."
        then: "wideeye setup connect telegram"
      - when: stopped
        say: "로그인이 풀렸어요. 텔레그램 칸에서 다시 로그인해 주세요."
        then: "wideeye setup connect telegram"
      - when: fail
        say: "지금 하기 어렵다면 텔레그램은 빼고 나중에 해도 돼요."
        then: "wideeye guide profile"

  - id: me
    title: "나 — 나를 부르는 말"
    why: "단체방에서 나를 부른 글을 알아보려고, 사람들이 나를 부르는 말을 적어 둬요."
    who: both
    needs: [try]
    do:
      - "사람들이 나를 부르는 말을 모두 알려 줘요 — 이름 · 직함 · 별명(예: 홍길동, 팀장님)."
      - "내가 쓰는 메일 주소가 더 있으면 알려 줘요(없으면 '없음')."
    run:
      - 'wideeye setup me --name "<부르는 말>"'
      - "wideeye setup me --email <주소>"
      - "wideeye setup status"
    check: setup_step
    params: {step: me}
    stuck:
      - when: left
        say: "아직 적지 않은 것이 있어요. 하나씩 다시 물어볼게요."
        then: me

  - id: boxes
    title: "상자 — 화면 칸에 이름 붙이기"
    why: "화면은 여섯 칸이에요. 다섯 칸은 자주 연락하는 모임 · 일 · 가족마다 하나, 여섯째 칸은 '개인 · 기타'예요."
    who: both
    needs: [me]
    do:
      - "자주 연락하는 모임 · 일 · 가족을 중요한 차례로 다섯 개까지 알려 줘요."
      - "이름은 짧게 지어요. 화면에는 열 글자쯤 보여요."
    run:
      - 'wideeye setup box add "<이름>"'
      - "wideeye setup show"
    check: setup_step
    params: {step: boxes}
    stuck:
      - when: left
        say: "아직 만든 칸이 없어요. 하나만 있어도 돼요."
        then: boxes

  - id: criteria
    title: "기준 — 어느 글이 어느 칸에 갈지"
    why: "글이 많이 온 곳부터 어느 칸인지 정하면, 다음부터 그 사람 · 방의 글은 그 칸에 떠요."
    who: both
    needs: [boxes]
    do:
      - "AI 가 보여 주는, 최근 7일 동안 글이 많이 온 다섯 곳을 봐요."
      - "곳마다 어느 칸인지 번호로 답해요(모르면 0)."
      - "칸마다 그 일에만 나오는 낱말을 서너 개 알려 줘요(예: 모임 이름 · 행사 이름)."
    run:
      - "wideeye setup who --unsorted --limit 5"
      - 'wideeye setup rule add "<상자>" sender <값>'
      - 'wideeye setup rule add "<상자>" word "<낱말>"'
      - "wideeye setup try"
    check: setup_step
    params: {step: criteria}
    stuck:
      - when: left
        say: "기준이 없는 칸이 있어요. 그 칸의 낱말을 하나만이라도 알려 주세요."
        then: criteria

  - id: extras
    title: "더 다듬기 — 일하는 시간과 화면"
    why: "필요하면 바꾸고, 아니면 그대로 두어도 돼요."
    who: both
    needs: [criteria]
    do:
      - "평일에 일하는 시간이 9시~18시와 다르면 알려 줘요."
      - {if: {tab5: plugged}, say: "탭5 화면이 거꾸로 보이면 탭5 화면을 한 번 톡 쳐요."}
      - {if: {tab5: plugged}, say: "그러면 아래에 띠가 떠요. 그 띠의 방향 단추를 눌러요."}
      - "더 자세히 바꾸고 싶으면 AI 에게 이 맥의 설정 화면을 열어 달라고 해요."
    run:
      - "wideeye setup hours <시작> <끝>"
      - "wideeye open settings"
    check: setup_step
    params: {step: hours}
    stuck:
      - when: left
        say: "아직 정하지 않은 것이 있어요."
        then: extras
